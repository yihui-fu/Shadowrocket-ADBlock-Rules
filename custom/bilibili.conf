# Domain rules from the Bilibili section of letswish/Shadowrocket-Module.
[Rule]
DOMAIN-SUFFIX,cm.ad.bilibili.com,REJECT
DOMAIN-SUFFIX,cm.adcommon.bilibili.com,REJECT
DOMAIN-SUFFIX,cm.game.bilibili.com,REJECT
DOMAIN-SUFFIX,cm.track.biligame.bilibili.com,REJECT

# Selected ad responses from Biliverse/ADBlock v0.7.5 for Shadowrocket.
[Script]
Bili-Splash-Feed = type=http-response,pattern=^https:\/\/(?:app\.bilibili\.com|app\.biliapi\.(?:net|com))\/x\/v2\/(?:splash\/(?:brand\/list|event\/list2|list|show)|feed\/index(?:\/(?:relate\/)?story)?)(?:\?|$),requires-body=1,script-path=https://github.com/Biliverse/ADBlock/releases/download/v0.7.5/response.bundle.js
Bili-Dynamic-Ads = type=http-response,pattern=^https:\/\/(?:grpc\.biliapi\.net|app\.bilibili\.com|app\.biliapi\.net)\/bilibili\.app\.dynamic\.v2\.Dynamic\/Dyn(?:All|Video)(?:Personal)?$,requires-body=1,binary-body-mode=1,script-path=https://github.com/Biliverse/ADBlock/releases/download/v0.7.5/response.bundle.js,argument=Dynamic.HotTopics=false&Dynamic.MostVisited=false&Dynamic.PersonalAdCard=true

[MITM]
hostname = app.bilibili.com, app.biliapi.net, app.biliapi.com, grpc.biliapi.net
h2 = true
